# One cheap job: typecheck, tests, and the two "generated files are current" checks.
# Node 18 is the floor in package.json engines, Node 22 is the current LTS.
# The job name is what the ruleset on main requires, matrix values included.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A merge made with GITHUB_TOKEN (auto-merge) does not trigger the push run,
  # so this keeps the badge honest.
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: npm test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: dist is up to date
        run: git diff --exit-code dist
      - name: README rule table is up to date
        run: node scripts/gen-rules-table.mjs --check
