# Publishes to npm and cuts the GitHub Release when a merge to main raises the version in package.json.
#
# To release: put a "## [x.y.z]" section in CHANGELOG.md, run `npm version <patch|minor|major> --no-git-tag-version`,
# and merge the pull request. This workflow then compares package.json's version with what npm has
# (scripts/release.mjs plan). If it is new, it runs the checks, publishes with provenance, then creates the
# v<version> tag and a GitHub Release whose notes are that CHANGELOG section. Re-running a failed run (Actions >
# publish > Re-run failed jobs) finishes whatever is left, so a failed release step does not need a new version.
#
# Tags and releases made with GITHUB_TOKEN do not start other workflow runs (GitHub documents this under
# "Triggering a workflow from a workflow"), and this workflow has no tag trigger, so nothing publishes twice.
#
# npm auth, in this order, with no edit needed to switch:
#   1. The repository secret NPM_TOKEN, when it exists: a granular token with publish rights on klipper-doctor
#      and bypass 2FA on.
#   2. Otherwise npm trusted publishing over OIDC. One-time setup on npmjs.com: the package's Settings >
#      Trusted publisher > GitHub Actions, repository kd-011/klipper-doctor, workflow filename publish.yml.
#      It needs npm 11.5.1 or later (installed below) and `id-token: write`.
# Provenance needs the repository to stay public.
name: publish

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-node is not given a registry: it would write a placeholder token, which would stop OIDC from being used.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: What is left to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs plan
      - name: Install npm 11 for trusted publishing
        if: steps.plan.outputs.publish == 'true'
        run: npm install -g npm@^11.5.1
      - if: steps.plan.outputs.publish == 'true'
        run: npm ci
      - if: steps.plan.outputs.publish == 'true'
        run: npm run check
      - if: steps.plan.outputs.publish == 'true'
        run: npm test
      - name: README rule table is up to date
        if: steps.plan.outputs.publish == 'true'
        run: node scripts/gen-rules-table.mjs --check
      - name: dist is up to date
        if: steps.plan.outputs.publish == 'true'
        run: git diff --exit-code dist
      # Before publishing, so a missing changelog section cannot leave a version on npm with no release.
      - name: Release notes from CHANGELOG.md
        if: steps.plan.outputs.publish == 'true' || steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Publish to npm
        if: steps.plan.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Publishing with the NPM_TOKEN secret"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          else
            echo "NPM_TOKEN is not set: publishing with trusted publishing (OIDC)"
          fi
          npm publish --provenance --access public --ignore-scripts
      - name: Tag and GitHub Release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --target "${GITHUB_SHA}"
