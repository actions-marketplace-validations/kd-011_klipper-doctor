<text x="20" y="74" xml:space="preserve"><tspan fill="#c9d1d9" font-weight="700">CRASH</tspan></text>
<text x="20" y="94" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">error  </tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#c9d1d9" font-weight="700">Klipper rejected the config</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">[config-error]</tspan></text>
<text x="20" y="114" xml:space="preserve"><tspan fill="#c9d1d9">          Klipper stopped at startup with "Config error": Option 'pid_integral_max' is</tspan></text>
<text x="20" y="134" xml:space="preserve"><tspan fill="#c9d1d9">          not valid in section 'extruder'. The config has pid_integral_max in</tspan></text>
<text x="20" y="154" xml:space="preserve"><tspan fill="#c9d1d9">          [extruder], and Klipper does not accept it. Config_Changes says it was removed</tspan></text>
<text x="20" y="174" xml:space="preserve"><tspan fill="#c9d1d9">          on 2021-11-02. Delete the line.</tspan></text>
<text x="20" y="194" xml:space="preserve"><tspan fill="#c9d1d9">          </tspan><tspan fill="#7ee787">Fix:</tspan><tspan fill="#c9d1d9"> Delete the line.</tspan></text>
<text x="20" y="214" xml:space="preserve"><tspan fill="#8b949e">          line 101: Config error</tspan></text>
<text x="20" y="234" xml:space="preserve"><tspan fill="#8b949e">          line 109: configparser.Error: Option 'pid_integral_max' is not valid in section 'extruder'</tspan></text>
<text x="20" y="254" xml:space="preserve"><tspan fill="#8b949e">          https://www.klipper3d.org/Config_checks.html</tspan></text>
<text x="20" y="274" xml:space="preserve"></text>
<text x="20" y="294" xml:space="preserve"><tspan fill="#c9d1d9" font-weight="700">CONFIG</tspan></text>
<text x="20" y="314" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">error  </tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#c9d1d9" font-weight="700">pid_integral_max was removed from Klipper in [extruder]</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">[removed-option]</tspan></text>
<text x="20" y="334" xml:space="preserve"><tspan fill="#c9d1d9">          Config_Changes lists pid_integral_max as removed on 2021-11-02. This log's</tspan></text>
<text x="20" y="354" xml:space="preserve"><tspan fill="#c9d1d9">          Klipper (v0.12.0-250-g1a2b3c4d) is newer than that, so it rejects the option.</tspan></text>
<text x="20" y="374" xml:space="preserve"><tspan fill="#c9d1d9">          Delete the line.</tspan></text>
<text x="20" y="394" xml:space="preserve"><tspan fill="#c9d1d9">          </tspan><tspan fill="#7ee787">Fix:</tspan><tspan fill="#c9d1d9"> Delete the line.</tspan></text>
<text x="20" y="414" xml:space="preserve"><tspan fill="#8b949e">          line 70: pid_integral_max = 0.2</tspan></text>
