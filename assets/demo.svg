<text x="20" y="34" xml:space="preserve"><tspan fill="#c9d1d9" font-weight="700">klipper-doctor 0.1.0</tspan><tspan fill="#8b949e">  klippy.log | Klipper v0.12.0-250-g1a2b3c4d | 1 session | 109 lines</tspan></text>
