# fixture: a raw printer.cfg built to make every raw-config rule fire at least once
# (except includes-not-read, which has its own file, includes.cfg).
# Hand-written for this repo; each defect is described next to it.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_ABC123-if00
pin_map: arduino

# [printer] has no max_velocity (missing-required) and sets max_accel twice (duplicate-option).
[printer]
kinematics: cartesian
max_accel: 3000
max_accel: 5000

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
step_distance: 0.0125
endstop_pin: ^PC0
position_endstop: 0
position_max: 235

# position_endstop 300 is outside position_min 0 and position_max 235 (endstop-range).
[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 300
position_max: 235

# no rotation_distance (missing-required).
[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
endstop_pin: ^PC2
position_endstop: 0.5
position_max: 250

# pid_integral_max was removed (removed-option); pid_kp is also set again in SAVE_CONFIG.
[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD2
microsteps: 16
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_kp: 20.0
pid_ki: 1.0
pid_kd: 100.0
pid_integral_max: 0.2
min_temp: 0
max_temp: 270

# "NTC 100K beta 3950" was removed as a sensor name (removed-option).
[heater_bed]
heater_pin: PC9
sensor_type: NTC 100K beta 3950
sensor_pin: PC4
control: watermark
min_temp: 0
max_temp: 130

# stealthchop_threshold 500 is neither unset nor 999999 (tmc-stealthchop-threshold).
[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 500

[fan]
pin: PA8

# [fan] a second time (duplicate-section).
[fan]
pin: PA8
kick_start_time: 0.5

# deprecated option name (deprecated-option).
[probe_eddy_current btt_eddy]
sensor_type: ldc1612
z_offset: 2.0

# safe_z_home and homing_override together (safe-z-home-conflict).
[safe_z_home]
home_xy_position: 117, 117

[homing_override]
axes: z
gcode:
    G28 X Y

# the line starting in column 0 ends the macro and breaks the file (gcode-unindented).
[gcode_macro BAD_MACRO]
gcode:
    G28
M117 Homing finished
    G1 X10

# no [input_shaper] section (no-input-shaper).

#*# <---------------------- SAVE_CONFIG ---------------------->
#*# DO NOT EDIT THIS BLOCK OR BELOW. The contents are auto-generated.
