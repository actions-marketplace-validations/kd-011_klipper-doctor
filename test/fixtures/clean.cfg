# fixture: a tidy raw printer.cfg that no config rule should fire on.
# Hand-written for this repo from the Klipper docs' sample layout (docs/Config_Reference.md).
# It has a SAVE_CONFIG block whose options do not repeat anything in the main config.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_ABC123-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000   # trailing comment

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC2
position_max: 250

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD2
microsteps: 16
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
min_temp: 0
max_temp: 270

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
control: watermark
min_temp: 0
max_temp: 130

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580

[input_shaper]
shaper_freq_x: 58.2
shaper_type_x: mzv
shaper_freq_y: 41.6
shaper_type_y: mzv

[gcode_macro START_PRINT]
description: Home and heat
gcode:
    # a comment inside the macro
    G28

    G1 Z10 F600
    M109 S{params.EXTRUDER|default(200)}

[gcode_macro END_PRINT]
gcode:
    {% if printer.toolhead.homed_axes == "xyz" %}
    M84
    {% endif %}

