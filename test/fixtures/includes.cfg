# fixture: a raw printer.cfg that pulls in other files, to check the single "included files were not read" note.
# Hand-written for this repo. [printer] is incomplete on purpose: with an include present the
# missing-required rule must stay quiet because the include may hold the rest.

[include mainsail.cfg]
[include macros/*.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_ABC123-if00

[printer]
kinematics: cartesian

[input_shaper]
shaper_freq_x: 58.2
shaper_type_x: mzv
