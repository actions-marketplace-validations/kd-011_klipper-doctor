# fixture: kinematics: cartesian with the stepper sections it reads
# made by scripts/make-fixtures.mjs from message formats in the Klipper source (kinematics/cartesian.py). Not a real user's log.
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000

[stepper_x]
step_pin: PB8
dir_pin: PC8
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD8
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PB9
dir_pin: PC9
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD9
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PB10
dir_pin: PC10
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD10
position_endstop: 0
position_max: 200

[input_shaper]
