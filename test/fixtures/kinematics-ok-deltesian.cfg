# fixture: kinematics: deltesian with the stepper sections it reads
# made by scripts/make-fixtures.mjs from message formats in the Klipper source (kinematics/deltesian.py). Not a real user's log.
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: deltesian
max_velocity: 300
max_accel: 3000

[stepper_left]
step_pin: PB12
dir_pin: PC12
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD12
position_endstop: 0
position_max: 200

[stepper_right]
step_pin: PB2
dir_pin: PC2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD2
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PB9
dir_pin: PC9
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD9
position_endstop: 0
position_max: 200

[input_shaper]
