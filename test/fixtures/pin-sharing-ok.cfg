# fixture: Pins Klipper lets two sections share (enable_pin) and the same pin name on different chips
# made by scripts/make-fixtures.mjs from message formats in the Klipper source (pins.py lookup_pin, extras/stepper_enable.py). Not a real user's log.
[mcu]
serial: /dev/serial/by-id/usb-Klipper_example

[mcu toolhead]
canbus_uuid: 11aa22bb33cc

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 235

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 235

[stepper_z]
step_pin: PB0
dir_pin: PC5
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC2
position_endstop: 0.5
position_max: 250

[extruder]
step_pin: toolhead:PB0
dir_pin: toolhead:PB1
microsteps: 16
rotation_distance: 33
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: toolhead:PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: toolhead:PA1
control: watermark
min_temp: 0
max_temp: 250

[heater_fan hotend_fan]
pin: PA0

[input_shaper]
