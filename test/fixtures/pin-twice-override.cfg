# fixture: The same pin on two steppers, with every repeat named in duplicate_pin_override (Klipper allows it)
# made by scripts/make-fixtures.mjs from message formats in the Klipper source (extras/duplicate_pin_override.py). Not a real user's log.
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[stepper_z]
step_pin: PB0
dir_pin: PC5
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC2
position_endstop: 0.5
position_max: 250

[stepper_z1]
step_pin: !PB0
dir_pin: PC6
microsteps: 16
rotation_distance: 8

[duplicate_pin_override]
pins: PB0, PC9

[input_shaper]
