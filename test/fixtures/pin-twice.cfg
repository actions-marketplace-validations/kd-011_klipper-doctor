# fixture: A pin set on two steppers, a heater and a fan, which Klipper refuses
# made by scripts/make-fixtures.mjs from message formats in the Klipper source (pins.py lookup_pin). Not a real user's log.
[mcu]
serial: /dev/serial/by-id/usb-Klipper_example

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 235

[stepper_y]
step_pin: !PB13
dir_pin: PB2
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 235

[stepper_z]
step_pin: mcu:PB0
dir_pin: PC5
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC2
position_endstop: 0.5
position_max: 250

[extruder]
step_pin: PB0
dir_pin: PB4
microsteps: 16
rotation_distance: 33
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: watermark
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PC8
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
control: watermark
min_temp: 0
max_temp: 130

[heater_fan hotend_fan]
pin: PC8

[input_shaper]
