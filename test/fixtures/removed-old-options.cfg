# fixture: One option from every Config_Changes removal added in this audit
# made by scripts/make-fixtures.mjs from message formats in the Klipper source (docs/Config_Changes.md). Not a real user's log.
[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
[input_shaper]

[neopixel a]
pin: PA1
color_order_GRB: False

[servo a]
pin: PA2
enable: True

[bed_mesh]
mesh_min: 1, 1
mesh_max: 2, 2
min_point: 1, 1
max_point: 2, 2
bed_radius: 100
radius: 100
bed_shape: round
samples: 2
sample_retract_dist: 2
samples_result: average

[z_tilt]
samples: 2

[extruder]
activate_gcode: T0
deactivate_gcode: T1
pressure_advance_lookahead_time: 0.01

[firmware_retraction]
z_hop: 1

[skew_correction]
xy_skew: 0.1

[sx1509 a]
address: 62

[tmc2660 stepper_x]
driver_VSENSE: 1

[tmc2130 stepper_y]
driver_BLANK_TIME_SELECT: 1

[endstop_phase stepper_z]
endstop_phase: 1

[display]
lcd_type: st7567
