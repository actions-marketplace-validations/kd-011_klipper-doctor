# fixture: TMC drivers on steppers that exist, every microsteps value one the TMC code accepts
# made by scripts/make-fixtures.mjs from message formats in the Klipper source (extras/tmc.py TMCMicrostepHelper). Not a real user's log.
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000

[stepper_x]
step_pin: PB13
dir_pin: PB12
microsteps: 256
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 235

[stepper_y]
step_pin: PB10
dir_pin: PB2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 235

[stepper_z]
step_pin: PB0
dir_pin: PC5
microsteps: 1
rotation_distance: 8
endstop_pin: ^PC2
position_endstop: 0.5
position_max: 250

[input_shaper]

[tmc2209 stepper_x]
uart_pin: PC11
run_current: 0.6

[tmc2209 stepper_y]
uart_pin: PC11
uart_address: 1
run_current: 0.6

[tmc5160 stepper_z]
cs_pin: PC12
run_current: 0.6
